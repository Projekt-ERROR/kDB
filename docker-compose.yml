version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: kdb_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kdbuser
      POSTGRES_PASSWORD: kdbpass
      POSTGRES_DB: kdb
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kdb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdbuser -d kdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kdb_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://kdbuser:kdbpass@database:5432/kdb
      PYTHONUNBUFFERED: 1
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - kdb-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload

  # React Frontend (we'll uncomment this later)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: kdb_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
  #     - kdb-network
  #   environment:
  #     - REACT_APP_API_URL=http://backend:5000

networks:
  kdb-network:
    driver: bridge

volumes:
  postgres_data:
