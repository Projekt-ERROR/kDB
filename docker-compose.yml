services:
  kdb-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kdb_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kdb:${KDB_DB_PASSWORD}@1mdb-postgres:5432/kdb
      ENVIRONMENT: ${ENVIRONMENT:-production}
    networks:
      - 1mdb-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  kdb-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kdb_frontend
    restart: unless-stopped
    networks:
      - 1mdb-internal

networks:
  1mdb-internal:
    external: true
